[project]
name = "ai-reader"
version = "0.1.0"
description = "GUI audiobook maker: open a book, preview it, read it aloud with Hugging Face TTS models and export to MP3/OGG/FLAC/WAV"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "PySide6>=6.6",
    "numpy",
    "lxml",
    "pymupdf",
    "charset-normalizer",
    "num2words",
    "soundfile",
    "lameenc",
    "mutagen",
    "sounddevice",
    "soxr",
    "huggingface_hub",
]

# torch < 2.9: from 2.9 torchaudio needs torchcodec, which on Windows needs separately installed FFmpeg DLLs
[project.optional-dependencies]
# RUAccent: neural stress marks (used by Silero, F5-TTS, the editor's «Расставить ударения» and voice training)
stress = ["ruaccent"]
silero = ["torch>=2.4,<2.9", "torchaudio>=2.4,<2.9", "omegaconf", "ruaccent"]
# f5-tts 1.1.10+ requires torchcodec (same Windows FFmpeg problem as torch 2.9); 1.1.9 is the last release without it
f5 = ["torch>=2.4,<2.9", "torchaudio>=2.4,<2.9", "f5-tts==1.1.9", "ruaccent", "transformers>=4.52,<5"]
# building your own voice: Whisper transcription + F5-TTS fine-tuning; av decodes M4A/AAC/AMR voice messages
train = ["ai-reader[f5]", "av"]
# optional 8-bit Adam for fine-tuning on GPUs with little memory
bnb = ["bitsandbytes>=0.45"]
all = ["ai-reader[silero,f5,train]"]

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[project.gui-scripts]
ai-reader = "ai_reader.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_reader"]

# CUDA 12.6 builds still support Pascal GPUs (GTX 10xx); newer CUDA builds dropped them.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
